name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: npm test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  macos-app:
    name: AutoChat.app (swift build, test, bundle)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Package.swift needs Swift 6 tools.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The Swift tests spawn macos/dev/mock-daemon.mjs with node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: swift --version
      - name: swift build && swift test
        working-directory: macos
        run: swift build && swift test
      - name: Build AutoChat.app
        run: macos/scripts/build-app.sh
      - name: Verify the bundle
        run: |
          codesign --verify --strict --verbose=2 macos/build/AutoChat.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' macos/build/AutoChat.app/Contents/Info.plist)" = com.bnookala.autochat
      - name: Zip AutoChat.app
        run: ditto -c -k --keepParent macos/build/AutoChat.app macos/build/AutoChat.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AutoChat.app
          path: macos/build/AutoChat.app.zip
          if-no-files-found: error
